name: Scan markets and notify

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log Telegram messages instead of sending)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          BITKUB_API_KEY: ${{ secrets.BITKUB_API_KEY }}
          BITKUB_API_SECRET: ${{ secrets.BITKUB_API_SECRET }}
          AUTO_TRADE_ENABLED: ${{ secrets.AUTO_TRADE_ENABLED }}
          AUTO_TRADE_AMOUNT_THB: ${{ secrets.AUTO_TRADE_AMOUNT_THB }}
          AUTO_TRADE_MAX_POSITIONS: ${{ secrets.AUTO_TRADE_MAX_POSITIONS }}
          AUTO_TRADE_MIN_CONFIDENCE: ${{ secrets.AUTO_TRADE_MIN_CONFIDENCE }}
          AUTO_TRADE_TAKE_PROFIT_PCT: ${{ secrets.AUTO_TRADE_TAKE_PROFIT_PCT }}
          AUTO_TRADE_STOP_LOSS_PCT: ${{ secrets.AUTO_TRADE_STOP_LOSS_PCT }}
          AUTO_TRADE_RISK_PCT: ${{ secrets.AUTO_TRADE_RISK_PCT }}
          BITKUB_FEE_PCT: ${{ secrets.BITKUB_FEE_PCT }}
        run: python scripts/main.py

      - name: Commit updated data
        run: |
          git config user.name "market-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/latest.json data/state.json data/positions.json data/trade_log.json
          # Only committed once a fetch has actually succeeded at least once
          # (e.g. not on a run where CoinGecko was unreachable before any
          # cache existed) -- `git add` on a missing path would otherwise
          # fail the step outright.
          if [ -f data/coingecko_cache.json ]; then
            git add data/coingecko_cache.json
          fi
          git diff --cached --quiet && exit 0
          git commit -m "chore: update market scan data [skip ci]"
          # If origin advanced since checkout (another push landed in between --
          # this is what silently dropped a real trade's position update on
          # 2026-08-21), retry with a rebase that prefers this run's freshly
          # computed data files over whatever else changed them, instead of
          # just failing and discarding this run's real trade state.
          # NOTE: during `rebase` (unlike `merge`), -X ours/theirs is inverted:
          # "ours" means the branch being rebased ONTO (origin/main, i.e. the
          # stale data), "theirs" means the commits being replayed (this run's
          # fresh data). We want our fresh data to win, so it's -X theirs.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push failed (attempt $attempt), rebasing onto origin/main..."
            git fetch origin main
            git rebase -X theirs origin/main
          done
          git push
